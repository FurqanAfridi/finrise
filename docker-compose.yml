services:
  db:
    image: postgres:16-alpine
    container_name: finrise-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finrise
      POSTGRES_PASSWORD: finrise
      POSTGRES_DB: finrise
    ports:
      - "5432:5432"
    volumes:
      - finrise_pg:/var/lib/postgresql/data

volumes:
  finrise_pg:
